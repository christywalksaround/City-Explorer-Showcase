openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chat
    description: Houston city-guide chat
paths:
  /unsplash/dish-inspiration:
    get:
      operationId: getDishInspiration
      responses:
        "200":
          description: Up to six live Unsplash food photos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InspirationPhoto"
        "503":
          description: Unsplash access key needs configuration
        "502":
          description: Unsplash temporarily unavailable
  /unsplash/download:
    post:
      operationId: trackInspirationDownload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InspirationDownload"
      responses:
        "204":
          description: Unsplash download event recorded
        "400":
          description: Invalid download location
        "503":
          description: Unsplash access key needs configuration
        "502":
          description: Unsplash temporarily unavailable
  /dishes:
    get:
      operationId: listDishes
      responses:
        "200":
          description: Photos newest first, without image data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DishPhoto"
    post:
      operationId: createDish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DishInput"
      responses:
        "201":
          description: Saved photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DishPhoto"
        "400":
          description: Invalid photo or fields
        "413":
          description: Photo exceeds 3 MB or JSON exceeds 5 MB
        "422":
          description: Inspector rejected the photo; nothing saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DishRejection"
        "502":
          description: Inspector unavailable; nothing saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /dishes/{id}/image:
    get:
      operationId: getDishImage
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Original uploaded image bytes
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "404":
          description: Photo not found
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /chat:
    post:
      operationId: sendCityGuideChat
      tags: [chat]
      summary: Ask the Houston city guide
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: City-guide answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: Invalid chat request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The AI provider could not complete the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The Gemini API key is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /chat/system-prompt:
    get:
      operationId: getCityGuideSystemPrompt
      tags: [chat]
      summary: Get the city-guide system prompt
      responses:
        "200":
          description: The active system prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSystemPrompt"
components:
  schemas:
    InspirationDownload:
      type: object
      required: [downloadLocation]
      properties:
        downloadLocation: { type: string }
    InspirationPhoto:
      type: object
      required: [id, imageUrl, rawUrl, altText, photographerName, photographerProfileUrl, downloadLocation]
      properties:
        id: { type: string }
        imageUrl: { type: string }
        rawUrl: { type: string }
        altText: { type: string }
        photographerName: { type: string }
        photographerProfileUrl: { type: string }
        downloadLocation: { type: string }
    DishRejection:
      type: object
      required: [error, reason]
      properties:
        error: { type: string }
        reason: { type: string }
    DishInput:
      type: object
      required: [title, image]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        caption: { type: string, maxLength: 1000 }
        image: { type: string, minLength: 1 }
    DishPhoto:
      type: object
      required: [id, title, caption, mimeType, inspectorNote, createdAt, imageUrl]
      properties:
        id: { type: integer }
        title: { type: string }
        caption: { type: string }
        mimeType: { type: string }
        inspectorNote: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        imageUrl: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ChatHistoryMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 4000
      required: [role, content]
    ChatSettings:
      type: object
      properties:
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 1
        topP:
          type: number
          minimum: 0
          maximum: 1
          default: 0.95
        maxOutputTokens:
          type: integer
          minimum: 32
          maximum: 1024
          default: 300
    ChatRequest:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
        history:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/ChatHistoryMessage"
        settings:
          $ref: "#/components/schemas/ChatSettings"
      required: [message]
    ChatUsage:
      type: object
      properties:
        promptTokens:
          type: integer
          minimum: 0
        outputTokens:
          type: integer
          minimum: 0
        totalTokens:
          type: integer
          minimum: 0
      required: [promptTokens, outputTokens, totalTokens]
    ChatResponse:
      type: object
      properties:
        reply:
          type: string
        usage:
          $ref: "#/components/schemas/ChatUsage"
        settings:
          $ref: "#/components/schemas/ChatSettings"
        model:
          type: string
        finishReason:
          type: string
      required: [reply, usage, settings, model, finishReason]
    ChatSystemPrompt:
      type: object
      properties:
        systemPrompt:
          type: string
      required: [systemPrompt]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

